<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Bookworm – Bookstore Management</title>
<link rel="stylesheet" href="css/style.css"></head><body>

<section id="login"><div class="lbox">
<div class="logo"><b>B</b>Bookworm</div>
<h2>Welcome back</h2><p>Sign in to manage your bookstore.</p>
<label>Email</label><input id="em" type="email" placeholder="admin@bookworm.com">
<label>Password</label><input id="pw" type="password" placeholder="••••••••">
<div class="err" id="err"></div>
<button class="btn" id="go">Sign in</button>
<div class="demo"><b>Demo credentials</b><br>Admin: admin@bookworm.com / admin123<br>Reader: reader@bookworm.com / read123</div>
</div></section>

<div id="app" class="hide">
<aside><div class="logo"><b>B</b>Bookworm</div><nav id="nav"></nav>
<button class="me" id="logout" title="Click to log out"><span class="av" id="av"></span><span id="who"></span></button></aside>
<main>
<div class="top"><input class="search" id="q" placeholder="🔍  Search books, authors…">
<select id="fil"></select><button class="ic" id="theme" title="Toggle theme">◐</button></div>
<div id="view"></div></main></div>
<div id="modal"></div>

<script src="js/app.js"></script></body></html>
